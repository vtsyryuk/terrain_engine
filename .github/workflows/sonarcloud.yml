name: SonarCloud Analysis

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'vtsyryuk' }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'vtsyryuk_terrain_engine' }}

jobs:
  verify:
    name: SonarCloud build and tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Build C++ targets and record compilation database
        run: |
          python .github/scripts/build-sonar-cpp.py
      - name: Upload scanner inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-inputs
          path: build/sonar/compile_commands.json
          if-no-files-found: error
          retention-days: 1
      - name: Report analysis activation state
        shell: bash
        run: |
          if [ "$SONAR_ENABLED" != 'true' ]; then
            echo '### SonarCloud analysis is not activated' >> "$GITHUB_STEP_SUMMARY"
            echo 'Build/test verification ran. No SonarCloud analysis or quality gate ran. Complete .github/SONARCLOUD.md and set SONAR_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
          fi

  analysis:
    name: SonarCloud analysis and quality gate
    permissions:
      contents: read
      pull-requests: read
    needs: verify
    # Untrusted PRs still get build/test verification, without receiving a token.
    if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require analysis credentials
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SonarCloud is enabled but SONAR_TOKEN is missing. Add the repository secret; see .github/SONARCLOUD.md.'
            exit 1
          fi
      - name: Download scanner inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sonar-inputs
          path: build/sonar
      - name: Analyze and enforce the quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        with:
          args: |
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
